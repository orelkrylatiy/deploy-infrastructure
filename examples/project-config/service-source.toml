[project]
type = "service"
delivery = "source"
keep_releases = 10
healthcheck_url = "http://127.0.0.1:3000/health"
build_commands = [["npm", "ci"], ["npm", "run", "build"]]
build_timeout_seconds = 1800
shared_files = [".env"]
shared_dirs = ["storage", "uploads"]

[service]
unit = "example-app.service"
