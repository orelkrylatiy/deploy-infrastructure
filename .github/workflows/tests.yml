name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile
        run: python -m compileall -q deploy_manager tests

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate YAML examples and shell scripts
        run: |
          ruby -e 'require "yaml"; ARGV.each { |path| YAML.load_file(path, aliases: true); puts "valid YAML: #{path}" }' $(find .github/workflows examples -type f -name "*.yml")
          bash -n scripts/install.sh scripts/update.sh
